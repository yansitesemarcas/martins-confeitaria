<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Martins Confeitaria — Administração</title>
<link rel="stylesheet" href="./admin.css?v=20261007-1">
</head>
<body>
<section id="login">
  <form id="loginForm" class="login-card">
    <div class="login-logo"><img src="../logo.png" alt="Martins Confeitaria"></div><h1>Martins Confeitaria</h1><p class="muted">Painel administrativo</p>
    <label>E-mail<input id="email" type="email" autocomplete="username" required></label>
    <label>Senha<input id="password" type="password" autocomplete="current-password" required></label>
    <div id="loginMsg" class="login-msg"></div>
    <button class="btn primary full" type="submit">Entrar</button>
  </form>
</section>
<div id="app" class="hidden">
  <aside class="side" id="side">
    <div class="brand"><span class="brand-logo"><img src="../logo.png" alt="Martins Confeitaria"></span><div><strong>Martins Confeitaria</strong><small>Administração</small></div></div>
    <nav>
      <button data-view="dashboard" class="nav">📊 Dashboard</button>
      <div class="group">Produtos</div>
      <button data-view="prod-ready" class="nav sub">🍰 Pronta Entrega</button>
      <div class="group">Pedidos</div>
      <button data-view="ord-ready" class="nav sub">🛒 Pronta Entrega</button>
      <button data-view="ord-orders" class="nav sub">📋 Encomendas</button>
      <div class="group">Encomendas</div>
      <button data-view="prod-orders" class="nav sub">💰 Valores de Encomendas</button>
      <div class="group">Site</div>
      <button data-view="settings" class="nav">⚙️ Configurações</button>
    </nav>
    <div class="side-foot">
      <a class="btn soft full" href="../index.html" target="_blank" rel="noopener">🌐 Ir para o site</a>
      <button class="btn danger full" id="logout">Sair</button>
    </div>
  </aside>
  <div class="shade" id="shade"></div>
  <main class="main">
    <header class="top"><button class="burger" id="burger" aria-label="Menu">☰</button><h1 id="title">Dashboard</h1><button class="btn soft" id="refresh">↻ Atualizar</button></header>
    <section id="view" class="view"></section>
  </main>
</div>
<div id="modal" class="modal hidden">
  <form id="pform" class="dialog">
    <div class="dhead"><h2 id="mtitle">Novo produto</h2><button type="button" class="x" data-close>×</button></div>
    <div class="dbody grid">
      <label class="full">Tipo<select id="f-area"><option value="pronta">Pronta Entrega</option><option value="encomendas">Encomenda</option></select></label>
      <label class="full">Nome<input id="f-name" required></label>
      <label>Classificação<select id="f-cat"></select></label>
      <label>Preço (R$)<input id="f-price" type="number" step="0.01" min="0"></label>
      <label class="rd">Desconto (%)<input id="f-disc" type="number" step="0.01" min="0" max="100"></label>
      <label>Ordem de exibição<input id="f-sort" type="number" step="1"></label>
      <label class="rd">Gramatura (g)<input id="f-gram" type="number" step="1" min="0"></label>
      <label class="rd">Serve até (pessoas)<input id="f-serve" type="number" step="1" min="0"></label>
      <label class="full">Descrição<textarea id="f-desc" rows="3"></textarea></label>
      <div class="full"><label>Foto<input id="f-photo" type="file" accept="image/*"></label><div class="row"><img id="prev" class="prev hidden" alt=""><button type="button" class="btn danger hidden" id="rmimg">Remover foto</button></div></div>
      <div class="full checks"><label><input id="f-avail" type="checkbox" checked> Ativo / disponível</label><label class="rd"><input id="f-feat" type="checkbox"> Destaque</label><label class="rd"><input id="f-appt" type="checkbox"> Agendamento obrigatório</label></div>
    </div>
    <div class="dfoot"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn primary" type="submit">Salvar alterações</button></div>
  </form>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="../defaults.js"></script>
<script src="./admin.js?v=20261007-1"></script>
</body>
</html>
