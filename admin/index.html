<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#67b0cb">

  <title>Martins Confeitaria — Painel Administrativo</title>

  <link rel="stylesheet" href="./admin.css?v=20261006">
</head>

<body>

  <!-- =====================================================
       LOGIN
  ====================================================== -->

  <div id="loginScreen" class="login-screen">

    <div class="login-card">

      <div class="login-logo">
        <div class="logo-circle">M</div>
      </div>

      <h1>Martins Confeitaria</h1>

      <p class="login-subtitle">
        Painel Administrativo
      </p>

      <form id="loginForm">

        <div class="form-group">
          <label for="loginEmail">E-mail</label>

          <input
            type="email"
            id="loginEmail"
            placeholder="Digite seu e-mail"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">Senha</label>

          <input
            type="password"
            id="loginPassword"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          type="submit"
          class="btn btn-primary btn-full"
        >
          Entrar
        </button>

        <div id="loginMsg" class="login-message"></div>

      </form>

    </div>

  </div>


  <!-- =====================================================
       APLICAÇÃO
  ====================================================== -->

  <div id="app" class="app hidden">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sidebar-brand">

        <div class="brand-logo">
          M
        </div>

        <div class="brand-name">
          <strong>Martins</strong>
          <span>Confeitaria</span>
        </div>

      </div>


      <nav class="sidebar-nav">

        <button
          type="button"
          class="nav-item active"
          data-tab="products"
        >
          <span class="nav-icon">🧁</span>
          <span>Produtos</span>
        </button>


        <button
          type="button"
          class="nav-item"
          data-tab="orders"
        >
          <span class="nav-icon">📦</span>
          <span>Pedidos</span>
        </button>


        <button
          type="button"
          class="nav-item"
          data-tab="cakes"
        >
          <span class="nav-icon">🎂</span>
          <span>Pedidos de Bolo</span>
        </button>


        <button
          type="button"
          class="nav-item"
          data-tab="content"
        >
          <span class="nav-icon">📝</span>
          <span>Conteúdo</span>
        </button>


        <button
          type="button"
          class="nav-item"
          data-tab="hours"
        >
          <span class="nav-icon">🕐</span>
          <span>Horários</span>
        </button>


        <button
          type="button"
          class="nav-item"
          data-tab="rules"
        >
          <span class="nav-icon">📋</span>
          <span>Regras</span>
        </button>


        <button
          type="button"
          class="nav-item"
          data-tab="media"
        >
          <span class="nav-icon">🖼️</span>
          <span>Mídia</span>
        </button>

      </nav>


      <div class="sidebar-footer">

        <button
          type="button"
          id="logout"
          class="nav-item logout"
        >
          <span class="nav-icon">🚪</span>
          <span>Sair</span>
        </button>

      </div>

    </aside>


    <!-- ===================================================
         ÁREA PRINCIPAL
    ==================================================== -->

    <main class="main">

      <header class="topbar">

        <button
          type="button"
          id="mobileMenu"
          class="mobile-menu"
          aria-label="Abrir menu"
        >
          ☰
        </button>


        <div class="page-heading">

          <h1 id="pageTitle">
            Produtos
          </h1>

          <p id="pageSubtitle">
            Gerencie os produtos da Martins Confeitaria.
          </p>

        </div>


        <button
          type="button"
          id="refreshBtn"
          class="btn btn-secondary"
        >
          ↻ Atualizar
        </button>

      </header>


      <!-- =================================================
           CONTEÚDO GERADO PELO admin.js
      ================================================== -->

      <section
        id="tabContent"
        class="tab-content"
      >

        <div class="loading-state">
          Carregando painel...
        </div>

      </section>

    </main>

  </div>


  <!-- =====================================================
       MODAL DE PRODUTO
  ====================================================== -->

  <div
    id="productModal"
    class="modal hidden"
  >

    <div
      class="modal-backdrop"
      data-close
    ></div>


    <div class="modal-box">

      <div class="modal-header">

        <div>
          <h2 id="productModalTitle">
            Novo produto
          </h2>

          <p>
            Preencha os dados do produto.
          </p>
        </div>


        <button
          type="button"
          class="modal-close"
          data-close
          aria-label="Fechar"
        >
          ×
        </button>

      </div>


      <form id="productForm">

        <div class="modal-body">

          <!-- FOTO -->

          <div class="form-group">

            <label for="productPhoto">
              Foto
            </label>

            <input
              type="file"
              id="productPhoto"
              accept="image/*"
            >

            <div
              id="productPhotoPreview"
              class="photo-preview"
            ></div>

          </div>


          <!-- NOME -->

          <div class="form-group">

            <label for="productName">
              Nome do produto
            </label>

            <input
              type="text"
              id="productName"
              placeholder="Nome do produto"
            >

          </div>


          <!-- CLASSIFICAÇÃO -->

          <div class="form-group">

            <label for="productCategory">
              Classificação
            </label>

            <select id="productCategory">

              <option value="">
                Selecione
              </option>

            </select>

          </div>


          <!-- ÁREA -->

          <div class="form-group">

            <label for="productArea">
              Área
            </label>

            <select id="productArea">

              <option value="">
                Selecione
              </option>

              <option value="delivery">
                Delivery
              </option>

              <option value="encomendas">
                Encomendas
              </option>

            </select>

          </div>


          <!-- PREÇO -->

          <div class="form-row">

            <div class="form-group">

              <label for="productPrice">
                Preço
              </label>

              <input
                type="number"
                id="productPrice"
                min="0"
                step="0.01"
                placeholder="0,00"
              >

            </div>


            <div class="form-group">

              <label for="productDiscount">
                Desconto
              </label>

              <input
                type="number"
                id="productDiscount"
                min="0"
                step="0.01"
                placeholder="0"
              >

            </div>

          </div>


          <!-- ORDEM -->

          <div class="form-row">

            <div class="form-group">

              <label for="productSort">
                Ordem
              </label>

              <input
                type="number"
                id="productSort"
                min="0"
                step="1"
                placeholder="0"
              >

            </div>


            <div class="form-group">

              <label for="productGramatura">
                Gramatura
              </label>

              <input
                type="text"
                id="productGramatura"
                placeholder="Ex.: 500g"
              >

            </div>

          </div>


          <!-- SERVE ATÉ -->

          <div class="form-group">

            <label for="productServeAte">
              Serve até
            </label>

            <input
              type="text"
              id="productServeAte"
              placeholder="Ex.: 4 pessoas"
            >

          </div>


          <!-- DESCRIÇÃO -->

          <div class="form-group">

            <label for="productDescription">
              Descrição
            </label>

            <textarea
              id="productDescription"
              rows="4"
              placeholder="Descrição do produto"
            ></textarea>

          </div>


          <!-- OPÇÕES -->

          <div class="options-box">

            <label class="check-option">

              <input
                type="checkbox"
                id="productAvailable"
                checked
              >

              <span>
                Produto disponível
              </span>

            </label>


            <label class="check-option">

              <input
                type="checkbox"
                id="productFeatured"
              >

              <span>
                Produto em destaque
              </span>

            </label>


            <label class="check-option">

              <input
                type="checkbox"
                id="productAppointment"
              >

              <span>
                Permitir agendamento
              </span>

            </label>

          </div>

        </div>


        <div class="modal-footer">

          <button
            type="button"
            class="btn btn-secondary close-modal"
            data-close
          >
            Cancelar
          </button>


          <button
            type="submit"
            class="btn btn-primary"
          >
            Salvar produto
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- =====================================================
       SUPABASE
  ====================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="../config.js"></script>

  <script src="../defaults.js"></script>

  <script src="./admin.js?v=20261006"></script>

</body>
</html>
