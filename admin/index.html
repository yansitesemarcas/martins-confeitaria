<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin — Martins Confeitaria</title>

  <meta
    name="description"
    content="Painel administrativo da Martins Confeitaria"
  >

  <style>
    /* =========================================================
       MARTINS CONFEITARIA — ADMIN
       CSS EMBUTIDO NO HTML
       Compatível com o admin.js atual
    ========================================================= */

    :root {
      --primary: #67b0cb;
      --primary-dark: #2b7896;
      --secondary: #f3b7bb;

      --white: #ffffff;
      --cream: #fffdf9;
      --background: #f5f8fa;

      --text: #263238;
      --muted: #71808a;

      --border: #e1e8ec;

      --success: #2e8b57;
      --danger: #c0392b;
      --warning: #d68910;

      --shadow-sm:
        0 2px 10px rgba(43, 120, 150, 0.08);

      --shadow:
        0 8px 25px rgba(43, 120, 150, 0.10);

      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: var(--background);
      color: var(--text);
      line-height: 1.5;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       LOGIN
    ========================================================= */

    #loginScreen {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        linear-gradient(
          135deg,
          #67b0cb 0%,
          #2b7896 100%
        );
    }

    .login-card {
      width: 100%;
      max-width: 430px;

      background: var(--white);

      border-radius: 22px;

      padding: 36px 30px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.18);

      text-align: center;
    }

    .login-logo {
      width: 82px;
      height: 82px;

      margin: 0 auto 18px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--primary);

      color: var(--white);

      font-size: 34px;
      font-weight: 800;
    }

    .login-card h1 {
      margin-bottom: 6px;

      color: var(--primary-dark);

      font-size: 25px;
    }

    .login-card p {
      margin-bottom: 25px;

      color: var(--muted);

      font-size: 14px;
    }

    /* =========================================================
       CAMPOS
    ========================================================= */

    .form-group {
      margin-bottom: 17px;
      text-align: left;
    }

    .form-group label {
      display: block;

      margin-bottom: 7px;

      color: var(--text);

      font-size: 14px;
      font-weight: 700;
    }

    .form-control,
    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    input[type="url"],
    input[type="date"],
    input[type="time"],
    select,
    textarea {
      width: 100%;

      min-height: 45px;

      padding: 11px 13px;

      border: 1px solid var(--border);

      border-radius: 10px;

      outline: none;

      background: var(--white);

      color: var(--text);

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .form-control:focus,
    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);

      box-shadow:
        0 0 0 3px rgba(103, 176, 203, 0.15);
    }

    /* =========================================================
       BOTÕES
    ========================================================= */

    .btn {
      min-height: 42px;

      border: 0;

      border-radius: 10px;

      padding: 10px 16px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      font-weight: 700;

      transition:
        transform 0.15s,
        opacity 0.15s,
        background 0.15s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: var(--primary);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #eef5f7;
      color: var(--primary-dark);
    }

    .btn-danger {
      background: #fbe9e7;
      color: var(--danger);
    }

    .btn-success {
      background: #e8f6ee;
      color: var(--success);
    }

    .btn-warning {
      background: #fff4df;
      color: var(--warning);
    }

    .btn-block {
      width: 100%;
    }

    /* =========================================================
       LOGIN MENSAGEM
    ========================================================= */

    #loginMsg {
      margin-top: 14px;

      color: var(--danger);

      font-size: 14px;
    }

    /* =========================================================
       APP
    ========================================================= */

    #app {
      min-height: 100vh;

      display: none;
    }

    #app.active {
      display: flex;
    }

    /* =========================================================
       SIDEBAR
    ========================================================= */

    .sidebar {
      position: fixed;

      left: 0;
      top: 0;
      bottom: 0;

      width: 250px;

      padding: 22px 15px;

      background: var(--white);

      border-right: 1px solid var(--border);

      z-index: 50;

      overflow-y: auto;
    }

    .brand {
      padding: 8px 10px 24px;

      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;

      flex: 0 0 48px;

      border-radius: 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--primary);

      color: var(--white);

      font-size: 21px;
      font-weight: 800;
    }

    .brand-text strong {
      display: block;

      color: var(--primary-dark);

      font-size: 16px;
    }

    .brand-text span {
      display: block;

      color: var(--muted);

      font-size: 12px;
    }

    .nav {
      display: flex;

      flex-direction: column;

      gap: 6px;
    }

    .nav button {
      width: 100%;

      min-height: 45px;

      border: 0;

      border-radius: 11px;

      padding: 10px 13px;

      background: transparent;

      color: var(--text);

      text-align: left;

      display: flex;
      align-items: center;
      gap: 10px;

      font-weight: 600;

      transition:
        background 0.2s,
        color 0.2s;
    }

    .nav button:hover {
      background: #eef7fa;
      color: var(--primary-dark);
    }

    .nav button.active {
      background: var(--primary);
      color: var(--white);
    }

    .nav-icon {
      width: 25px;

      text-align: center;

      font-size: 18px;
    }

    .sidebar-footer {
      margin-top: 25px;

      padding-top: 18px;

      border-top: 1px solid var(--border);
    }

    /* =========================================================
       MAIN
    ========================================================= */

    .main {
      width: calc(100% - 250px);

      margin-left: 250px;

      min-height: 100vh;
    }

    .topbar {
      min-height: 72px;

      padding: 15px 25px;

      background: var(--white);

      border-bottom: 1px solid var(--border);

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      position: sticky;

      top: 0;

      z-index: 30;
    }

    .topbar h1 {
      color: var(--primary-dark);

      font-size: 21px;
    }

    .topbar-actions {
      display: flex;

      align-items: center;

      gap: 9px;

      flex-wrap: wrap;
    }

    .content {
      padding: 25px;
    }

    /* =========================================================
       CARDS
    ========================================================= */

    .card {
      background: var(--white);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      box-shadow: var(--shadow-sm);

      padding: 20px;
    }

    .card + .card {
      margin-top: 18px;
    }

    .card-header {
      margin-bottom: 17px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      flex-wrap: wrap;
    }

    .card-title {
      color: var(--primary-dark);

      font-size: 19px;

      font-weight: 800;
    }

    .card-subtitle {
      color: var(--muted);

      font-size: 13px;
    }

    /* =========================================================
       GRID
    ========================================================= */

    .grid {
      display: grid;

      gap: 18px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    /* =========================================================
       PRODUTOS
    ========================================================= */

    .product-list {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(270px, 1fr)
        );

      gap: 17px;
    }

    .product-card {
      overflow: hidden;

      background: var(--white);

      border: 1px solid var(--border);

      border-radius: 14px;

      box-shadow: var(--shadow-sm);

      transition:
        transform 0.2s,
        box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-2px);

      box-shadow: var(--shadow);
    }

    .product-image {
      width: 100%;
      height: 190px;

      object-fit: cover;

      background: #eef5f7;
    }

    .product-image-placeholder {
      width: 100%;
      height: 190px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #eef5f7;

      color: var(--muted);

      font-size: 42px;
    }

    .product-body {
      padding: 15px;
    }

    .product-name {
      margin-bottom: 5px;

      color: var(--primary-dark);

      font-weight: 800;

      font-size: 17px;
    }

    .product-category {
      margin-bottom: 9px;

      color: var(--muted);

      font-size: 12px;
    }

    .product-price {
      margin-bottom: 12px;

      font-size: 18px;

      font-weight: 800;
    }

    .product-actions {
      display: flex;

      gap: 7px;

      flex-wrap: wrap;
    }

    .product-actions .btn {
      flex: 1;
      min-width: 80px;
    }

    /* =========================================================
       BADGES
    ========================================================= */

    .badge {
      display: inline-flex;
      align-items: center;

      min-height: 26px;

      padding: 4px 9px;

      border-radius: 999px;

      font-size: 11px;

      font-weight: 800;
    }

    .badge-success {
      background: #e8f6ee;
      color: var(--success);
    }

    .badge-danger {
      background: #fbe9e7;
      color: var(--danger);
    }

    .badge-primary {
      background: #e9f5f9;
      color: var(--primary-dark);
    }

    .badge-warning {
      background: #fff4df;
      color: var(--warning);
    }

    /* =========================================================
       TABELAS
    ========================================================= */

    .table-wrap {
      width: 100%;

      overflow-x: auto;
    }

    table {
      width: 100%;

      border-collapse: collapse;

      min-width: 650px;
    }

    th,
    td {
      padding: 12px;

      border-bottom: 1px solid var(--border);

      text-align: left;

      vertical-align: middle;
    }

    th {
      color: var(--primary-dark);

      background: #f6fafb;

      font-size: 13px;
    }

    td {
      font-size: 14px;
    }

    /* =========================================================
       MODAL
    ========================================================= */

    .modal {
      position: fixed;

      inset: 0;

      z-index: 100;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(38, 50, 56, 0.55);
    }

    .modal.open,
    .modal.active,
    .modal.show {
      display: flex;
    }

    .modal-content {
      width: 100%;

      max-width: 760px;

      max-height: 92vh;

      overflow-y: auto;

      background: var(--white);

      border-radius: 18px;

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.25);
    }

    .modal-header {
      padding: 18px 20px;

      border-bottom: 1px solid var(--border);

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      position: sticky;

      top: 0;

      background: var(--white);

      z-index: 2;
    }

    .modal-header h2 {
      color: var(--primary-dark);

      font-size: 20px;
    }

    .modal-close,
    .close-modal {
      width: 36px;
      height: 36px;

      border: 0;

      border-radius: 50%;

      background: #eef5f7;

      color: var(--text);

      font-size: 20px;
    }

    .modal-close:hover,
    .close-modal:hover {
      background: var(--secondary);
    }

    .modal-body {
      padding: 20px;
    }

    .modal-footer {
      padding: 15px 20px;

      border-top: 1px solid var(--border);

      display: flex;

      justify-content: flex-end;

      gap: 9px;

      flex-wrap: wrap;
    }

    /* =========================================================
       FORMULÁRIO DE PRODUTO
    ========================================================= */

    #productForm {
      display: block;
    }

    .form-section {
      padding: 16px;

      margin-bottom: 17px;

      border: 1px solid var(--border);

      border-radius: 12px;

      background: #fcfefe;
    }

    .form-section-title {
      margin-bottom: 14px;

      color: var(--primary-dark);

      font-weight: 800;
    }

    .checkbox-row {
      display: flex;

      align-items: center;

      gap: 9px;

      margin-bottom: 10px;
    }

    .checkbox-row input {
      width: 18px;
      height: 18px;
    }

    .photo-preview {
      margin-top: 10px;

      max-width: 180px;

      max-height: 180px;

      object-fit: cover;

      border-radius: 12px;

      border: 1px solid var(--border);
    }

    /* =========================================================
       ORDERS / ENCOMENDAS
    ========================================================= */

    .order-card {
      background: var(--white);

      border: 1px solid var(--border);

      border-radius: 14px;

      padding: 17px;

      box-shadow: var(--shadow-sm);
    }

    .order-card + .order-card {
      margin-top: 12px;
    }

    .order-header {
      display: flex;

      align-items: flex-start;
      justify-content: space-between;

      gap: 15px;

      flex-wrap: wrap;

      margin-bottom: 13px;
    }

    .order-title {
      color: var(--primary-dark);

      font-size: 17px;

      font-weight: 800;
    }

    .order-info {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(200px, 1fr)
        );

      gap: 10px;

      margin-top: 12px;
    }

    .info-item {
      padding: 10px;

      background: #f7fafb;

      border-radius: 9px;
    }

    .info-label {
      display: block;

      margin-bottom: 3px;

      color: var(--muted);

      font-size: 11px;

      font-weight: 700;

      text-transform: uppercase;
    }

    .info-value {
      color: var(--text);

      font-size: 14px;
    }

    /* =========================================================
       EMPTY
    ========================================================= */

    .empty-state {
      padding: 45px 20px;

      text-align: center;

      color: var(--muted);
    }

    .empty-state-icon {
      margin-bottom: 10px;

      font-size: 40px;
    }

    .empty-state strong {
      display: block;

      margin-bottom: 5px;

      color: var(--primary-dark);

      font-size: 17px;
    }

    /* =========================================================
       LOADING
    ========================================================= */

    .loading {
      min-height: 150px;

      display: flex;

      align-items: center;
      justify-content: center;

      color: var(--muted);
    }

    .spinner {
      width: 30px;
      height: 30px;

      border: 3px solid #dcecf1;

      border-top-color: var(--primary);

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       ALERTAS
    ========================================================= */

    .alert {
      padding: 12px 14px;

      border-radius: 10px;

      margin-bottom: 15px;

      font-size: 14px;
    }

    .alert-info {
      background: #e9f5f9;
      color: var(--primary-dark);
    }

    .alert-success {
      background: #e8f6ee;
      color: var(--success);
    }

    .alert-danger {
      background: #fbe9e7;
      color: var(--danger);
    }

    .alert-warning {
      background: #fff4df;
      color: var(--warning);
    }

    /* =========================================================
       RESPONSIVO
    ========================================================= */

    @media (max-width: 1100px) {
      .grid-4 {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .grid-3 {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 850px) {
      .sidebar {
        position: relative;

        width: 100%;

        height: auto;

        border-right: 0;

        border-bottom: 1px solid var(--border);
      }

      #app.active {
        display: block;
      }

      .main {
        width: 100%;

        margin-left: 0;
      }

      .nav {
        display: grid;

        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .sidebar-footer {
        display: none;
      }

      .topbar {
        position: relative;
      }
    }

    @media (max-width: 650px) {
      .content {
        padding: 15px;
      }

      .topbar {
        padding: 13px 15px;

        align-items: flex-start;

        flex-direction: column;
      }

      .topbar-actions {
        width: 100%;
      }

      .topbar-actions .btn {
        flex: 1;
      }

      .grid-2,
      .grid-3,
      .grid-4 {
        grid-template-columns: 1fr;
      }

      .product-list {
        grid-template-columns: 1fr;
      }

      .nav {
        grid-template-columns: 1fr;
      }

      .modal {
        padding: 10px;
      }

      .modal-content {
        max-height: 96vh;
      }

      .modal-body {
        padding: 15px;
      }

      .login-card {
        padding: 28px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       LOGIN
  ======================================================== -->

  <section id="loginScreen">

    <div class="login-card">

      <div class="login-logo">
        M
      </div>

      <h1>Martins Confeitaria</h1>

      <p>
        Acesso ao painel administrativo
      </p>

      <form id="loginForm">

        <div class="form-group">

          <label for="loginEmail">
            E-mail
          </label>

          <input
            id="loginEmail"
            name="email"
            type="email"
            autocomplete="username"
            required
          >

        </div>

        <div class="form-group">

          <label for="loginPassword">
            Senha
          </label>

          <input
            id="loginPassword"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >

        </div>

        <button
          type="submit"
          class="btn btn-primary btn-block"
        >
          Entrar
        </button>

        <div id="loginMsg"></div>

      </form>

    </div>

  </section>


  <!-- =======================================================
       APP
  ======================================================== -->

  <div id="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="brand">

        <div class="brand-logo">
          M
        </div>

        <div class="brand-text">
          <strong>Martins</strong>
          <span>Confeitaria</span>
        </div>

      </div>


      <nav class="nav">

        <button
          type="button"
          data-tab="products"
          class="active"
        >
          <span class="nav-icon">🍰</span>
          <span>Produtos</span>
        </button>

        <button
          type="button"
          data-tab="orders"
        >
          <span class="nav-icon">🛒</span>
          <span>Pedidos</span>
        </button>

        <button
          type="button"
          data-tab="cakes"
        >
          <span class="nav-icon">🎂</span>
          <span>Pedidos de Bolo</span>
        </button>

        <button
          type="button"
          data-tab="content"
        >
          <span class="nav-icon">📝</span>
          <span>Conteúdo</span>
        </button>

        <button
          type="button"
          data-tab="hours"
        >
          <span class="nav-icon">🕐</span>
          <span>Horários</span>
        </button>

        <button
          type="button"
          data-tab="rules"
        >
          <span class="nav-icon">⚙️</span>
          <span>Regras</span>
        </button>

        <button
          type="button"
          data-tab="media"
        >
          <span class="nav-icon">🖼️</span>
          <span>Mídia</span>
        </button>

      </nav>


      <div class="sidebar-footer">

        <button
          type="button"
          id="logout"
          class="btn btn-danger btn-block"
        >
          Sair
        </button>

      </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

      <header class="topbar">

        <h1>
          Painel Administrativo
        </h1>

        <div class="topbar-actions">

          <button
            type="button"
            id="refreshBtn"
            class="btn btn-secondary"
          >
            ↻ Atualizar
          </button>

        </div>

      </header>


      <section
        class="content"
        id="tabContent"
      >

        <div class="loading">

          <div class="spinner"></div>

        </div>

      </section>

    </main>

  </div>


  <!-- =======================================================
       MODAL DE PRODUTO
  ======================================================== -->

  <div
    id="productModal"
    class="modal"
    aria-hidden="true"
  >

    <div class="modal-content">

      <div class="modal-header">

        <h2>
          Produto
        </h2>

        <button
          type="button"
          class="modal-close"
          data-close
          aria-label="Fechar"
        >
          ×
        </button>

      </div>


      <form id="productForm">

        <div class="modal-body">

          <!-- FOTO -->

          <div class="form-section">

            <div class="form-section-title">
              Foto
            </div>

            <div class="form-group">

              <label for="productPhoto">
                Imagem do produto
              </label>

              <input
                id="productPhoto"
                name="photo"
                type="file"
                accept="image/*"
              >

            </div>

          </div>


          <!-- INFORMAÇÕES -->

          <div class="form-section">

            <div class="form-section-title">
              Informações do produto
            </div>

            <div class="grid grid-2">

              <div class="form-group">

                <label for="productName">
                  Nome
                </label>

                <input
                  id="productName"
                  name="name"
                  type="text"
                  required
                >

              </div>


              <div class="form-group">

                <label for="productCategory">
                  Classificação
                </label>

                <select
                  id="productCategory"
                  name="category"
                >
                </select>

                <button
                  type="button"
                  id="newCategoryBtn"
                  class="btn btn-secondary"
                  style="margin-top:8px;"
                >
                  + Nova
                </button>

              </div>


              <div class="form-group">

                <label for="productArea">
                  Área
                </label>

                <select
                  id="productArea"
                  name="area"
                >

                  <option value="delivery">
                    Delivery
                  </option>

                  <option value="encomendas">
                    Encomendas
                  </option>

                </select>

              </div>


              <div class="form-group">

                <label for="productPrice">
                  Preço
                </label>

                <input
                  id="productPrice"
                  name="price"
                  type="number"
                  min="0"
                  step="0.01"
                  required
                >

              </div>


              <div class="form-group">

                <label for="productDiscount">
                  Desconto
                </label>

                <input
                  id="productDiscount"
                  name="discount"
                  type="number"
                  min="0"
                  step="0.01"
                >

              </div>


              <div class="form-group">

                <label for="productSort">
                  Ordem
                </label>

                <input
                  id="productSort"
                  name="sort"
                  type="number"
                  min="0"
                  step="1"
                >

              </div>


              <div class="form-group">

                <label for="productGramatura">
                  Gramatura
                </label>

                <input
                  id="productGramatura"
                  name="gramatura"
                  type="text"
                >

              </div>


              <div class="form-group">

                <label for="productServeAte">
                  Serve até
                </label>

                <input
                  id="productServeAte"
                  name="serveAte"
                  type="text"
                >

              </div>

            </div>

          </div>


          <!-- DESCRIÇÃO -->

          <div class="form-section">

            <div class="form-section-title">
              Descrição
            </div>

            <div class="form-group">

              <label for="productDescription">
                Descrição do produto
              </label>

              <textarea
                id="productDescription"
                name="description"
              ></textarea>

            </div>

          </div>


          <!-- STATUS -->

          <div class="form-section">

            <div class="form-section-title">
              Status
            </div>

            <label class="checkbox-row">

              <input
                id="productAvailable"
                name="available"
                type="checkbox"
                checked
              >

              <span>
                Produto disponível
              </span>

            </label>


            <label class="checkbox-row">

              <input
                id="productFeatured"
                name="featured"
                type="checkbox"
              >

              <span>
                Produto em destaque
              </span>

            </label>


            <label class="checkbox-row">

              <input
                id="productAppointment"
                name="appointment"
                type="checkbox"
              >

              <span>
                Produto sob encomenda
              </span>

            </label>

          </div>

        </div>


        <div class="modal-footer">

          <button
            type="button"
            class="btn btn-secondary"
            data-close
          >
            Cancelar
          </button>

          <button
            type="submit"
            class="btn btn-primary"
          >
            Salvar produto
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- =======================================================
       SCRIPTS
  ======================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="../config.js"></script>

  <script src="../defaults.js"></script>

  <script src="./admin.js?v=20261005"></script>

</body>
</html>
