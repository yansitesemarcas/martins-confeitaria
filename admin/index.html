<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#67b0cb"
  >

  <title>Martins Confeitaria — Painel Administrativo</title>

  <link
    rel="stylesheet"
    href="./admin.css?v=20261005"
  >
</head>

<body>

  <!-- =========================================================
       LOGIN
       ========================================================= -->

  <section id="loginScreen" class="login-screen">

    <div class="login-card">

      <div class="login-logo">
        <div class="login-logo-mark">M</div>
      </div>

      <h1>Martins Confeitaria</h1>

      <p class="login-subtitle">
        Painel Administrativo
      </p>

      <form id="loginForm">

        <div class="form-group">
          <label for="loginEmail">
            E-mail
          </label>

          <input
            type="email"
            id="loginEmail"
            autocomplete="username"
            placeholder="Digite seu e-mail"
            required
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">
            Senha
          </label>

          <input
            type="password"
            id="loginPassword"
            autocomplete="current-password"
            placeholder="Digite sua senha"
            required
          >
        </div>

        <button
          type="submit"
          class="btn btn-primary btn-full"
          id="loginButton"
        >
          Entrar
        </button>

        <div
          id="loginMessage"
          class="login-message"
        ></div>

      </form>

    </div>

  </section>


  <!-- =========================================================
       PAINEL ADMINISTRATIVO
       ========================================================= -->

  <div
    id="adminApp"
    class="admin-app"
    style="display:none;"
  >

    <!-- =======================================================
         SIDEBAR
         ======================================================= -->

    <aside class="sidebar">

      <div class="sidebar-header">

        <div class="brand">

          <div
            id="adminLogo"
            class="brand-logo"
          >
            M
          </div>

          <div class="brand-text">
            <strong>Martins</strong>
            <span>Confeitaria</span>
          </div>

        </div>

      </div>


      <!-- MENU -->

      <nav class="sidebar-nav">

        <button
          type="button"
          class="nav-item active"
          data-tab="products"
        >
          <span class="nav-icon">🛍️</span>
          <span>Produtos</span>
        </button>

        <button
          type="button"
          class="nav-item"
          data-tab="orders"
        >
          <span class="nav-icon">📦</span>
          <span>Pedidos</span>
        </button>

        <button
          type="button"
          class="nav-item"
          data-tab="cakes"
        >
          <span class="nav-icon">🎂</span>
          <span>Pedidos de Bolo</span>
        </button>

        <button
          type="button"
          class="nav-item"
          data-tab="content"
        >
          <span class="nav-icon">📝</span>
          <span>Conteúdo</span>
        </button>

        <button
          type="button"
          class="nav-item"
          data-tab="hours"
        >
          <span class="nav-icon">🕐</span>
          <span>Horários</span>
        </button>

        <button
          type="button"
          class="nav-item"
          data-tab="rules"
        >
          <span class="nav-icon">⚙️</span>
          <span>Regras</span>
        </button>

        <button
          type="button"
          class="nav-item"
          data-tab="media"
        >
          <span class="nav-icon">🖼️</span>
          <span>Mídia</span>
        </button>

      </nav>


      <!-- RODAPÉ -->

      <div class="sidebar-footer">

        <button
          type="button"
          id="logoutButton"
          class="logout-button"
        >
          <span>🚪</span>
          <span>Sair</span>
        </button>

      </div>

    </aside>


    <!-- =======================================================
         CONTEÚDO PRINCIPAL
         ======================================================= -->

    <main class="main-content">

      <!-- HEADER -->

      <header class="topbar">

        <div class="topbar-left">

          <button
            type="button"
            id="mobileMenuButton"
            class="mobile-menu-button"
            aria-label="Abrir menu"
          >
            ☰
          </button>

          <div>

            <h1 id="pageTitle">
              Produtos
            </h1>

            <p id="pageSubtitle">
              Gerencie os produtos da Martins Confeitaria.
            </p>

          </div>

        </div>


        <div class="topbar-right">

          <button
            type="button"
            id="refreshButton"
            class="btn btn-secondary"
          >
            ↻ Atualizar
          </button>

        </div>

      </header>


      <!-- =====================================================
           ESTATÍSTICAS
           ===================================================== -->

      <section
        id="statsSection"
        class="stats-grid"
      >

        <div class="stat-card">

          <div class="stat-icon">
            🛍️
          </div>

          <div>

            <span class="stat-label">
              Produtos
            </span>

            <strong
              id="statProducts"
              class="stat-value"
            >
              0
            </strong>

          </div>

        </div>


        <div class="stat-card">

          <div class="stat-icon">
            ✅
          </div>

          <div>

            <span class="stat-label">
              Disponíveis
            </span>

            <strong
              id="statAvailable"
              class="stat-value"
            >
              0
            </strong>

          </div>

        </div>


        <div class="stat-card">

          <div class="stat-icon">
            📦
          </div>

          <div>

            <span class="stat-label">
              Pedidos
            </span>

            <strong
              id="statOrders"
              class="stat-value"
            >
              0
            </strong>

          </div>

        </div>


        <div class="stat-card">

          <div class="stat-icon">
            🎂
          </div>

          <div>

            <span class="stat-label">
              Encomendas
            </span>

            <strong
              id="statCakes"
              class="stat-value"
            >
              0
            </strong>

          </div>

        </div>

      </section>


      <!-- =====================================================
           ABAS
           ===================================================== -->

      <section class="content-area">

        <!-- PRODUTOS -->

        <div
          id="tab-products"
          class="tab-content active"
        ></div>


        <!-- PEDIDOS -->

        <div
          id="tab-orders"
          class="tab-content"
          style="display:none;"
        ></div>


        <!-- PEDIDOS DE BOLO -->

        <div
          id="tab-cakes"
          class="tab-content"
          style="display:none;"
        ></div>


        <!-- CONTEÚDO -->

        <div
          id="tab-content"
          class="tab-content"
          style="display:none;"
        ></div>


        <!-- HORÁRIOS -->

        <div
          id="tab-hours"
          class="tab-content"
          style="display:none;"
        ></div>


        <!-- REGRAS -->

        <div
          id="tab-rules"
          class="tab-content"
          style="display:none;"
        ></div>


        <!-- MÍDIA -->

        <div
          id="tab-media"
          class="tab-content"
          style="display:none;"
        ></div>

      </section>

    </main>

  </div>


  <!-- =========================================================
       TOAST
       ========================================================= -->

  <div
    id="toast"
    class="toast"
    aria-live="polite"
  ></div>


  <!-- =========================================================
       MODAL
       ========================================================= -->

  <div
    id="modal"
    class="modal"
    style="display:none;"
  >

    <div class="modal-overlay"></div>

    <div class="modal-content">

      <button
        type="button"
        id="modalClose"
        class="modal-close"
        aria-label="Fechar"
      >
        ×
      </button>

      <div id="modalBody"></div>

    </div>

  </div>


  <!-- =========================================================
       SCRIPTS
       ========================================================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="../config.js"></script>

  <script src="../defaults.js"></script>

  <script src="./admin.js?v=20261005"></script>

</body>
</html>
