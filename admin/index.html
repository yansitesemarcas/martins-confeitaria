<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Admin — Martins Confeitaria</title>

  <link
    rel="stylesheet"
    href="admin.css"
  >
</head>

<body>

  <!-- LOGIN -->
  <div id="login" class="login">

    <div class="login-card">

      <!-- LOGO -->
      <img
        src="../logo.png"
        alt="Martins Confeitaria"
      >

      <h1>Martins Confeitaria</h1>

      <p>Área administrativa</p>

      <form id="loginForm">

        <input
          name="email"
          type="email"
          placeholder="E-mail"
          required
        >

        <input
          name="password"
          type="password"
          placeholder="Senha"
          required
        >

        <button type="submit">
          Entrar
        </button>

        <small id="loginMsg"></small>

      </form>

    </div>

  </div>


  <!-- PAINEL -->
  <div id="app" class="app hidden">

    <aside>

      <!-- LOGO -->
      <img
        src="../logo.png"
        alt="Martins Confeitaria"
      >

      <b>Martins</b>

      <button data-tab="products">
        Produtos
      </button>

      <button data-tab="orders">
        Pedidos
      </button>

      <button data-tab="cakes">
        Bolos personalizados
      </button>

      <button data-tab="content">
        Conteúdo
      </button>

      <button data-tab="hours">
        Horários e regras
      </button>

      <button data-tab="media">
        Mídia
      </button>

      <button id="logout">
        Sair
      </button>

    </aside>


    <main>

      <header>

        <div>

          <span>PAINEL</span>

          <h1 id="title">
            Produtos
          </h1>

        </div>

        <a
          href="../"
          target="_blank"
        >
          Ver site ↗
        </a>

      </header>


      <section id="view"></section>

    </main>

  </div>


  <!-- SUPABASE -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <!-- CONFIGURAÇÕES -->
  <script src="../config.js"></script>

  <script src="../defaults.js"></script>

  <!-- ADMIN -->
  <script src="admin.js"></script>

</body>

</html>
